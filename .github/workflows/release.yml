name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TAG: ${{ github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64-linux
          - os: macos-latest
            arch: universal-macos
          - os: windows-latest
            arch: x86_64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libpulse-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --release
      - run: cargo build --release

      - name: Universal binary
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output target/release/deadlywp target/release/deadlywp target/x86_64-apple-darwin/release/deadlywp

      - name: Package
        run: |
          mkdir -p pkg dist
          cp LICENSE README.md pkg
          case $RUNNER_OS in
            Linux)
              cp target/release/deadlywp assets/deadlywp.desktop assets/icon.png assets/icon-32.png pkg
              tar -czf "dist/deadlywp-${TAG#v}-$ARCH.tar.gz" -C pkg . ;;
            macOS)
              cp target/release/deadlywp pkg
              tar -czf "dist/deadlywp-${TAG#v}-$ARCH.tar.gz" -C pkg . ;;
            Windows)
              cp target/release/deadlywp.exe pkg
              (cd pkg && 7z a "../dist/deadlywp-${TAG#v}-$ARCH.zip" *) ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$TAG" --title "${TAG#v}" --generate-notes dist/*
