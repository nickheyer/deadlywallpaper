[package]
name = "deadlywp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Deadly Wallpaper: live wallpapers for Linux, macOS and Windows"
repository = "https://github.com/nickheyer/deadlywallpaper"
default-run = "deadlywp"

[[bin]]
name = "deadlywp"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
log = "0.4"
dirs = "6"
interprocess = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }
mime_guess = "2"
starship-battery = "0.11"
auto-launch = "0.6"
realfft = "3"
libloading = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
eframe = { version = "0.36", features = ["persistence"] }
egui_extras = { version = "0.36", features = ["image", "file"] }
rfd = "0.17"
wry = "0.57"
tray-icon = { version = "0.25", default-features = false, features = ["libappindicator"] }
raw-window-handle = "0.6"
http = "1.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
cairo-rs = "0.18"
gdk-pixbuf = "0.18"
webkit2gtk = "=2.0.2"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = "0.13"
zbus = { version = "5", features = ["blocking-api"] }
libpulse-binding = "2"
libpulse-simple-binding = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_Storage_FileSystem",
  "Win32_System_ProcessStatus",
  "Win32_System_LibraryLoader",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
webview2-com = "0.39"
cpal = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSString", "NSArray", "NSDictionary", "NSValue", "NSGeometry", "NSThread", "NSData", "NSURL", "NSDistributedNotificationCenter", "NSOperation", "NSRunLoop", "NSDate"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSView", "NSScreen", "NSResponder", "NSRunningApplication", "NSWorkspace", "NSEvent", "NSGraphics", "NSImage", "NSBitmapImageRep", "NSImageRep", "NSColor", "NSOpenGLView", "NSOpenGL"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration"] }
objc2-core-graphics = { version = "0.3", features = ["CGWindow", "CGDirectDisplay", "CGWindowLevel", "CGGeometry", "CGImage"] }
objc2-core-foundation = { version = "0.3", features = ["CFArray", "CFDictionary", "CFString", "CFNumber", "CFUUID", "CFBase", "CFCGTypes"] }
block2 = "0.6"
dispatch2 = "0.3"
cpal = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
