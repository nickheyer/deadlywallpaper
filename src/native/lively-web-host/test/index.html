<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>lively-web-host test wallpaper</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10203a; color: #fff; font-family: sans-serif; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #panel { position: absolute; left: 24px; top: 24px; padding: 16px 20px; background: rgba(0,0,0,.55);
           border-radius: 12px; font-size: 22px; line-height: 1.5; }
  #panel b { color: #ffd166; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <div>lively-web-host test page</div>
  <div>frames: <b id="frames">0</b></div>
  <div>speed: <b id="v-speed">-</b></div>
  <div>showGrid: <b id="v-showGrid">-</b></div>
  <div>accent: <b id="v-accent">-</b></div>
  <div>caption: <b id="v-caption">-</b></div>
  <div>shape: <b id="v-shape">-</b></div>
  <div>asset: <b id="v-asset">-</b></div>
  <div>resetButton: <b id="v-resetButton">-</b></div>
  <div>playback: <b id="v-playback">-</b></div>
  <div>audio frames: <b id="v-audio">0</b></div>
  <div>sysinfo: <b id="v-sysinfo">-</b></div>
  <div>track: <b id="v-track">-</b></div>
</div>
<script>
  var state = { speed: 10, showGrid: true, accent: '#ff8800', shape: 1, frames: 0, audio: 0 };

  function setText(id, text) {
    var el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  function livelyPropertyListener(name, value) {
    window.__lastProp = { name: name, value: value };
    state[name] = value;
    setText('v-' + name, JSON.stringify(value));
    console.log('prop ' + name + '=' + JSON.stringify(value));
  }

  function livelyWallpaperPlaybackChanged(obj) {
    setText('v-playback', JSON.stringify(obj));
    console.log('playback ' + JSON.stringify(obj));
  }

  function livelySystemInformation(info) {
    setText('v-sysinfo', JSON.stringify(info));
    console.log('sysinfo ' + JSON.stringify(info));
  }

  function livelyCurrentTrack(info) {
    setText('v-track', JSON.stringify(info));
    console.log('track ' + JSON.stringify(info));
  }

  function livelyAudioListener(data) {
    state.audio++;
    setText('v-audio', state.audio + ' (' + (Array.isArray(data) ? data.length : 'n/a') + ' bands)');
    if (state.audio === 1) console.log('audio first frame bands=' + (Array.isArray(data) ? data.length : 'n/a'));
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var t = 0;

  function resize() {
    canvas.width = window.innerWidth * (window.devicePixelRatio || 1);
    canvas.height = window.innerHeight * (window.devicePixelRatio || 1);
  }
  window.addEventListener('resize', resize);
  resize();

  function draw() {
    state.frames++;
    t += (Number(state.speed) || 10) / 600;
    var w = canvas.width, h = canvas.height;
    var g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, 'hsl(' + ((t * 40) % 360) + ', 70%, 45%)');
    g.addColorStop(1, 'hsl(' + ((t * 40 + 120) % 360) + ', 70%, 25%)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    if (state.showGrid) {
      ctx.strokeStyle = 'rgba(255,255,255,.15)';
      ctx.lineWidth = 2;
      for (var x = 0; x < w; x += 120) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
      for (var y = 0; y < h; y += 120) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
    }
    var cx = w / 2 + Math.cos(t) * w * 0.3, cy = h / 2 + Math.sin(t * 1.3) * h * 0.3, r = Math.min(w, h) * 0.12;
    ctx.fillStyle = state.accent || '#ff8800';
    ctx.beginPath();
    if (Number(state.shape) === 0) {
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
    } else if (Number(state.shape) === 2) {
      ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy + r); ctx.lineTo(cx - r, cy + r); ctx.closePath();
    } else {
      ctx.rect(cx - r, cy - r, r * 2, r * 2);
    }
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = (r * 0.6) + 'px sans-serif';
    ctx.fillText(String(state.caption || ''), cx - r, cy + r * 1.6);
    if (state.frames % 30 === 0) setText('frames', String(state.frames));
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  document.addEventListener('visibilitychange', function () {
    console.log('visibility=' + document.visibilityState + ' frames=' + state.frames);
  });
  window.addEventListener('load', function () {
    console.log('lively-web-host test page loaded ' + window.innerWidth + 'x' + window.innerHeight +
      ' dpr=' + window.devicePixelRatio +
      ' color-scheme=' + (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  });
</script>
</body>
</html>
